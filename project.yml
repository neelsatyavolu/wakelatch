name: Wakelatch
options:
  bundleIdPrefix: co.xanom
  deploymentTarget:
    iOS: "26.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: VTQW687WBQ
    CODE_SIGN_STYLE: Automatic
packages:
  WakelatchCore:
    path: Packages/WakelatchCore
targets:
  Wakelatch:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: WakelatchCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wakelatch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSAlarmKitUsageDescription: Wakelatch schedules alarms that keep ringing until you finish a challenge.
        NSCameraUsageDescription: The eyes-open challenge uses the front camera to check your eyes are open. Nothing is recorded or sent anywhere.
        NSMotionUsageDescription: The walking challenge counts your steps. Nothing leaves your phone.
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.wakelatch
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        # App Intents can't resolve intent types that live in Xcode's debug dylib.
        ENABLE_DEBUG_DYLIB: NO
  WakelatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Wakelatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.wakelatch.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Wakelatch.app/Wakelatch
        BUNDLE_LOADER: $(TEST_HOST)
  WakelatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: Wakelatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.xanom.wakelatch.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Wakelatch
schemes:
  Wakelatch:
    build:
      targets:
        Wakelatch: all
    test:
      targets: [WakelatchTests, WakelatchUITests]
